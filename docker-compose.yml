services:
  homedash:
    build: .
    # Une instance gère plusieurs comptes GitHub. Pour des données complètement
    # séparées, une seconde instance : surcharger ces trois variables (README) :
    #   HOMEDASH_NAME=homedash-2 HOMEDASH_PORT=7778 HOMEDASH_DATA=./data-2 \
    #     docker compose -p homedash-2 up -d --build
    container_name: ${HOMEDASH_NAME:-homedash}
    restart: always
    ports:
      # bind local uniquement : data/ contient des mots de passe et des jetons GitHub
      - "127.0.0.1:${HOMEDASH_PORT:-7777}:80"
    environment:
      - TZ=Europe/Paris
      # Noms supplémentaires sous lesquels la page est servie, si tu l'ouvres au
      # réseau (`homedash.lan,192.168.1.20`). Tout autre `Host` est refusé : c'est
      # ce qui empêche un site tiers de lire l'API par DNS rebinding.
      - HOMEDASH_HOSTS=${HOMEDASH_HOSTS:-}
      # Dépôt dont le CHANGELOG.md sert à détecter une mise à jour (lu avec le jeton
      # d'un compte connecté, qui doit y avoir accès).
      - HOMEDASH_REPO=${HOMEDASH_REPO:-lepetitpaco/homedash}
      # Dossier du projet sur la machine (celui d'où l'on lance compose) : la
      # commande de mise à jour affichée dans la page commence par un `cd` dedans.
      - HOMEDASH_DIR=${PWD:-}
      # Ce que vaut /host côté hôte : sert à écrire les commandes à copier avec
      # les vrais chemins, et à comprendre un chemin absolu de l'hôte.
      # Windows n'a souvent pas de HOME : son dossier personnel est USERPROFILE.
      - HOST_HOME=${HOME:-${USERPROFILE:-}}
      # Ce que vaut /hostdisk côté hôte (même valeur que le montage plus bas).
      - HOST_DISK=${HOMEDASH_DISK:-${SystemDrive:-/Volumes}}
    volumes:
      # le répertoire entier, pas fichier par fichier : permet l'écriture atomique
      - ${HOMEDASH_DATA:-./data}:/app/data
      # Onglet Local : le dossier personnel, en LECTURE SEULE. Les dossiers
      # réellement parcourus se choisissent dans Réglages (local.roots) — rien à
      # modifier ici. `:ro` est une ceinture par-dessus des bretelles : le backend
      # ne sait de toute façon que lire (backend/gitread.py relit les fichiers
      # .git lui-même, aucune commande git n'est lancée).
      - ${HOME:-${USERPROFILE:-}}:/host:ro
      # Onglet Local : le disque aussi, en LECTURE SEULE, pour des clones rangés
      # hors du dossier personnel. Windows : le lecteur système (`C:`) ; Mac : les
      # volumes (`/Volumes`, disques externes), ce que Docker Desktop partage
      # d'office. Autre endroit : HOMEDASH_DISK=/chemin (partagé dans Docker Desktop).
      - ${HOMEDASH_DISK:-${SystemDrive:-/Volumes}}/:/hostdisk:ro
