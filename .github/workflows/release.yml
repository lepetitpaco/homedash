# Une Release à chaque nouvelle version arrivée sur main : l'appli construite pour
# Mac (Apple Silicon et Intel) et Windows, publiée avec les empreintes dont l'appli
# se sert pour se mettre à jour (latest-mac.yml, latest.yml). Le tag vX.Y.Z se pose
# tout seul, d'après la tête du CHANGELOG. Du code arrivé sur main sans nouvelle
# version fait échouer le run ; la doc seule ne publie rien.
#
# Lancé à la main (Actions → release → Run workflow), il construit l'appli sans
# rien publier : les fichiers se téléchargent depuis le run (artefacts), pour
# essayer une branche avant de taguer.
#
# Sécurité : droits minimaux (lecture partout, écriture des Releases dans le
# seul job qui publie) ; actions figées par empreinte de commit, pas par tag.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Version à publier
        id: read
        run: |
          app=$(node -p "require('./desktop/package.json').version")
          log=$(sed -n 's/^## \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CHANGELOG.md | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$app" = "$log" ] || { echo "desktop/package.json $app, CHANGELOG $log : à aligner"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$log" >/dev/null; then
            changed=$(git diff --name-only "v$log" HEAD -- src server desktop public index.html package-lock.json)
            [ -z "$changed" ] || { echo "Du code est arrivé sur main sans nouvelle version (CHANGELOG et desktop/package.json) :"; echo "$changed"; exit 1; }
            echo "Rien à publier : v$log existe déjà."
            exit 0
          fi
          echo "tag=v$log" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Front et serveur
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Une fois suffit, et les tests du disque créent des liens symboliques
      # (droits d'administrateur sous Windows).
      - name: Typage et tests
        if: runner.os == 'macOS'
        run: |
          npm run typecheck
          npm test

      - name: Appli
        shell: bash
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          sh assemble.sh
          npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist.noindex/*.dmg
            desktop/dist.noindex/*.zip
            desktop/dist.noindex/*.exe
            desktop/dist.noindex/latest*.yml

  publish:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          # Notes : l'entrée du CHANGELOG pour cette version.
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "homedash $version" --notes-file notes.md
