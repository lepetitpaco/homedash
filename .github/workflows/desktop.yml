# Appli de bureau : sur un tag `desktop-vX.Y.Z`, construit les .dmg (arm64,
# x64) et l'installateur Windows, et les publie dans la release du tag. Même recette qu'en local :
# desktop/release.sh.
#
# PAS sur les tags de homedash (vX.Y.Z) : l'appli charge l'interface depuis le
# container, elle ne change que quand desktop/ change. Repo privé : une minute
# macOS compte pour 10 du quota (~50 min par release).
name: Appli de bureau

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Windows se construit à part, sur Linux (Docker, une minute = 1 du quota).
      - run: sh desktop/release.sh "${GITHUB_REF_NAME#desktop-v}"
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS: '0'

  windows:
    needs: mac            # la release existe : on y ajoute l'installateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          V="${GITHUB_REF_NAME#desktop-v}"
          APP_VERSION=$V sh desktop/build-windows.sh
          gh release upload "$GITHUB_REF_NAME" "desktop/dist.noindex/homedash-$V-win-x64-setup.exe" \
            "desktop/dist.noindex/homedash-$V-win-x64.zip"
        env:
          GH_TOKEN: ${{ github.token }}
