# Appli de bureau (desktop/) : construite sur macOS, jointe à la release
# GitHub du tag (homedash-X.Y.Z-arm64.dmg, -x64.dmg). Pas de signature Apple :
# signature « ad hoc » seulement (voir GUIDE.md, premier lancement).
#
# Déclenchée par un tag `desktop-vX.Y.Z`, PAS par les versions de homedash :
# l'appli charge l'interface depuis le serveur, elle ne change que quand
# desktop/ change. Et le repo est privé : une minute macOS en coûte 10 du quota.
name: Appli de bureau

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Version de l'appli = celle du tag (desktop-v1.0.0 → 1.0.0).
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: homedash-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
